<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>House Cleaning in Mechanicsburg, PA | Carpet Guys</title>
    <meta
      name="description"
      content="Professional house cleaning for recurring cleaning, deep cleaning, and move-in/move-out cleaning in Mechanicsburg, PA and surrounding communities. Request a free quote."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <!--
      PRELOAD HERO IMAGE:
      Once a real hero photo is added at /hero.jpg (or the path set in src/config.ts),
      uncomment this preload so LCP stays fast:
      <link rel="preload" as="image" href="/hero.jpg" />
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Carpet Guys",
        "telephone": "+1-717-701-2797",
        "areaServed": "Mechanicsburg, PA and surrounding communities",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mechanicsburg",
          "addressRegion": "PA",
          "addressCountry": "US"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "serviceType": "House Cleaning",
        "provider": { "@type": "LocalBusiness", "name": "Carpet Guys", "telephone": "+1-717-701-2797" },
        "areaServed": "Mechanicsburg, PA and surrounding communities",
        "description": "Professional house cleaning including recurring cleaning, deep cleaning, and move-in/move-out cleaning for residential properties."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How much does home cleaning cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pricing depends on home size, number of bedrooms and bathrooms, cleaning type, and how often you'd like service. Request a quote so we can give you an accurate number."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to be home during the cleaning?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Many customers give us entry instructions and go about their day. If you'd rather be home, that's fine too."
            }
          },
          {
            "@type": "Question",
            "name": "Do you bring your own cleaning supplies?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, our team brings all supplies and equipment. If you'd like us to use a specific product on certain surfaces, just let us know when you book."
            }
          },
          {
            "@type": "Question",
            "name": "How long does a cleaning take?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It depends on the size of the home and the type of cleaning. A recurring cleaning is usually quicker than a first-time deep clean. We'll give you a time estimate when we quote your home."
            }
          },
          {
            "@type": "Question",
            "name": "Do you offer recurring cleaning?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Weekly, biweekly, and monthly plans are available, and the schedule can be adjusted anytime."
            }
          },
          {
            "@type": "Question",
            "name": "Can I customize my cleaning?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Tell us which rooms or areas to focus on and anything to skip, and we'll build the visit around what matters most to you."
            }
          },
          {
            "@type": "Question",
            "name": "Do you clean move-in or move-out properties?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, for tenants, owners, and landlords who need the home cleaned before or after a move."
            }
          },
          {
            "@type": "Question",
            "name": "Are you licensed and insured?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Carpet Guys is licensed and insured."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Hidden static forms for Netlify's build-time form parser.
      Netlify scans the deployed HTML (not JS-rendered markup) for
      forms with the netlify attribute, so these mirror the real
      React forms field-for-field. The actual visible/interactive
      forms live in src/components/ShortEstimateForm.tsx and
      FinalEstimateForm.tsx; their submits POST to "/" with a
      matching form-name, which Netlify then routes to these
      definitions. Do not remove — required for Netlify Forms to
      detect and store submissions.
    -->
    <form name="short-estimate" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="short-estimate" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="zip" />
      <input type="text" name="area" />
      <textarea name="details"></textarea>
    </form>

    <form name="final-estimate" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="final-estimate" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="projectType" />
      <input type="text" name="zip" />
      <input type="text" name="timeline" />
      <textarea name="details"></textarea>
    </form>
    <!--
      Field names (area, projectType) are unchanged from the original
      hydroseeding forms — ShortEstimateForm.tsx now sends bedroom count
      as "area" and FinalEstimateForm.tsx sends cleaning type as
      "projectType". Field names must stay in sync with forms.ts.
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
