<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Chinook Hydroseeding</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Manrope", "Inter", Arial, sans-serif;
        background: #183751;
        color: #ffffff;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        width: 100%;
        text-align: center;
      }
      .check {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: #599445;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .check svg {
        width: 30px;
        height: 30px;
      }
      h1 {
        font-size: clamp(28px, 4vw, 36px);
        font-weight: 800;
        margin: 0 0 14px;
        line-height: 1.15;
      }
      p {
        font-size: 17px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.8);
        margin: 0 0 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #599445;
        color: #ffffff;
        font-weight: 700;
        font-size: 16px;
        text-decoration: none;
        padding: 15px 28px;
        border-radius: 13px;
        margin: 0 6px 10px;
      }
      .btn-outline {
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </div>
      <h1>Thank You — Your Request Was Received</h1>
      <p>
        Our team will review your property and follow up with pricing and next steps. If your
        project is time-sensitive, feel free to call us directly.
      </p>
      <a class="btn" href="tel:+13608887301">Call (360) 888-7301</a>
      <a class="btn btn-outline" href="/">Back to Homepage</a>
    </div>
  </body>
</html>
